<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybernetic Fury</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💢</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
</head>
<body>

    <div id="main-layout">
    <div id="game-container">
        <div id="hub-screen" class="overlay">
            <h1>CYBERNETIC FURY</h1>
            <div class="hub-section">
                <h3>Modo</h3>
                <div class="hub-options" id="mode-options">
                    <button class="hub-option selected" data-mode="1v1">
                        <span class="hub-option-title">1 v 1</span>
                        <span class="hub-option-desc">Duelo na arena menor</span>
                    </button>
                    <button class="hub-option" data-mode="2v2">
                        <span class="hub-option-title">2 v 2</span>
                        <span class="hub-option-desc">Arena neon com obstáculos</span>
                    </button>
                    <button class="hub-option" data-mode="3v3">
                        <span class="hub-option-title">3 v 3</span>
                        <span class="hub-option-desc">Arena neon com obstáculos</span>
                    </button>
                </div>
            </div>
            <div class="hub-section">
                <h3>Jogadores</h3>
                <div class="hub-options" id="vs-options">
                    <button class="hub-option selected" data-vs="ai">
                        <span class="hub-option-title">VOCÊ vs IA</span>
                        <span class="hub-option-desc">Aliados e inimigos controlados pela IA</span>
                    </button>
                    <button class="hub-option" data-vs="pvp">
                        <span class="hub-option-title">P1 vs P2</span>
                        <span class="hub-option-desc">Dois jogadores (teclado ou controle)</span>
                    </button>
                </div>
            </div>
            <div class="hub-section">
                <h3>Controles</h3>
                <div class="input-row" data-player="p1">
                    <span class="input-label">P1</span>
                    <button class="input-option selected" data-input="keyboard">⌨ Teclado</button>
                    <button class="input-option" data-input="gamepad">🎮 Controle</button>
                    <span class="gamepad-status"></span>
                </div>
                <div class="input-row hidden" data-player="p2">
                    <span class="input-label">P2</span>
                    <button class="input-option selected" data-input="keyboard">⌨ Teclado</button>
                    <button class="input-option" data-input="gamepad">🎮 Controle</button>
                    <span class="gamepad-status"></span>
                </div>
            </div>
            <button id="hub-start" class="hub-start">ESCOLHER LUTADORES ▶</button>
        </div>

        <div id="character-selection" class="overlay hidden">
            <button id="back-to-hub" class="back-button">◀ Menu</button>
            <h1>CYBERNETIC FURY</h1>
            <p id="selection-title" class="selection-title"></p>
            <div class="selection-grid">
                <div class="character-card" id="select-titan" data-lore="Titan foi um grande combatente da guerra que lutou bravamente pelo seu país e acabou perdendo muitos amigos. Sendo assim, acabou saindo, pois não estava mais gostando de ter tantas perdas. Hoje em dia, ele luta contra bandidos para proteger sua cidade.">
                    <h2>TITAN</h2>
                    <canvas id="titan-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-spark" data-lore="Spark é um robô que foi criado para garantir a segurança de um laboratório do governo. Porém, em um dia, uma grande explosão destruiu todos os outros robôs, fazendo com que apenas ele sobrasse e acabassem abandonando o projeto por falta de recursos. Depois de sair do laboratório, ele decidiu continuar a lutar, pois todo o seu corpo e essência eram feitos para isso.">
                    <h2>SPARK</h2>
                    <canvas id="spark-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-hades" data-lore="Um heroi de guerra que usava seus poderosos punhos de fogo para enfrentar o inimigo e levalos para conhecer as chamas eternas, quando foi destronado por seus aliados jurou lutar contra todos para voltar ao seu imperio.">
                    <h2>HADES</h2>
                    <canvas id="hades-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-jack" data-lore="Jack ja foi um homem, porem em uma noite de halloween ele acabou caindo em uma maldição que fez sua fantasia de terror ser eternamente grudada ao seu corpo e sendo obrigado a continuar o espirito de dia das bruxas para assustar todos que entrarem em seu caminho.">
                    <h2>JACK</h2>
                    <canvas id="jack-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-genji" data-lore="um lendario espadachin que teve que ver seu irmao ser morto, depois disso jurou matar todos aqueles que estiveram envolvidos no ataque e para isso esta preparado para derramar o quanto de sangue for necessário">
                    <h2>GENJI</h2>
                    <canvas id="genji-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-ryu" data-lore="não tem muita historia... ele apenas gosta de sair no soco">
                    <h2>RYU</h2>
                    <canvas id="ryu-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-lorenzo" data-lore="ele perdeu tudo em apostas e acabou tendo que morrar na rua, porém um dia o tecnico do maior time da espanha viu ele jogando com uma bola que encontrou na rua e percebeu potencial, depois de entrar para o time se tornou o melhor atacante em menos de 1 ano">
                    <h2>LORENZO</h2>
                    <canvas id="lorenzo-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-malenia" data-lore="A espada de miquela, ela nunca conheceu a derrota">
                    <h2>MALENIA</h2>
                    <canvas id="malenia-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-maliketh" data-lore="Maliketh é a leal Besta Presa nas Sombras e meio-irmão da Rainha Marika, a Eterna, uma Empírea de ascendência Numen, que se tornaria o recipiente do Elden Ring">
                    <h2>MALIKETH</h2>
                    <canvas id="maliketh-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-kayn" data-lore="Um jovem assassino que encontrou Rhaast, uma foice viva que tenta dominar quem a empunha. A cada luta os dois disputam o controle: se Kayn estiver perdendo, Rhaast toma conta e ele vira uma fera vermelha; se estiver vencendo, ele domina a foice e vira o Assassino das Sombras azul.">
                    <h2>KAYN</h2>
                    <canvas id="kayn-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-celestia" data-lore="Uma guardiã que desceu das estrelas para proteger os que lutam ao seu lado. Por onde passa, flores de luz giram ao seu redor e fecham as feridas de seus aliados. Quando a batalha aperta, ela abre os braços e o círculo de cura se expande para abrigar o time inteiro.">
                    <h2>CELESTIA</h2>
                    <canvas id="celestia-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-flora" data-lore="Criada no coração de uma floresta que sobreviveu no meio da cidade de concreto, Flora aprendeu a falar com as plantas. Ela arremessa flores encantadas que voam sozinhas até o aliado mais próximo e desabrocham em cura.">
                    <h2>FLORA</h2>
                    <canvas id="flora-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-nyx" data-lore="Nyx foi cobaia de um experimento que tentava criar soldados que se regeneram. Deu errado: ela não consegue mais se curar sozinha, só roubando a vida dos outros. Hoje usa essa maldição a favor de quem luta ao seu lado, arrancando energia vital dos inimigos com as garras e mandando para os aliados.">
                    <h2>NYX</h2>
                    <canvas id="nyx-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-viper" data-lore="Ex-atiradora de elite de uma corporação de armas químicas, Viper fugiu levando o protótipo de um rifle que dispara toxinas. Escondida atrás da máscara de gás, ela espera pacientemente o momento certo: quando a linha vermelha aparece, o alvo já está condenado.">
                    <h2>VIPER</h2>
                    <canvas id="viper-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-gear" data-lore="Gear perdeu o braço num acidente na fábrica e construiu um mecânico com sucata. Desde então, nunca mais entrou numa briga sozinho: sempre leva uma torreta montada por ele mesmo, que atira em qualquer um que se aproxime.">
                    <h2>GEAR</h2>
                    <canvas id="gear-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
            </div>
            <div id="lore-tooltip" class="hidden"></div>
        </div>

        <div id="loading-screen" class="overlay hidden">
            <div class="loading-controls">
                <h3>Controles</h3>
                <!-- Preenchido pelo jogo conforme o modo (1 jogador ou P1 vs P2) -->
                <div id="controls-content"></div>
            </div>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <span id="win-text"></span>
            <div class="game-over-buttons">
                <button id="rematch-button">Revanche</button>
                <button id="restart-button">Menu</button>
            </div>
        </div>

        <!-- Placar montado pelo jogo: uma coluna por time, um cartão por lutador -->
        <div id="hud"></div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Painel lateral com os controles (some em telas estreitas) -->
    <aside id="controls-panel">
        <h3>Controles</h3>
        <div id="controls-panel-content"></div>
    </aside>
    </div>

    <div id="volume-control">
        <button id="volume-icon" title="Silenciar / ativar som">🔊</button>
        <input type="range" id="volume-slider" min="0" max="100" value="70" aria-label="Volume">
        <span id="volume-value">70%</span>
    </div>

    <!-- A ordem importa: personagens e áudio primeiro, lógica do jogo por último -->
    <script src="characters.js"></script>
    <script src="audio.js"></script>
    <script src="game.js"></script>
</body>
</html>
