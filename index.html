<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybernetic Fury</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💢</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
</head>
<body>

    <div id="main-layout">
    <div id="game-container">
        <div id="hub-screen" class="overlay">
            <h1>CYBERNETIC FURY</h1>
            <div class="hub-section">
                <h3>Modo</h3>
                <div class="hub-options" id="mode-options">
                    <button class="hub-option selected" data-mode="1v1">
                        <span class="hub-option-title">1 v 1</span>
                        <span class="hub-option-desc">Duelo na arena menor</span>
                    </button>
                    <button class="hub-option" data-mode="2v2">
                        <span class="hub-option-title">2 v 2</span>
                        <span class="hub-option-desc">Arena neon com obstáculos</span>
                    </button>
                    <button class="hub-option" data-mode="3v3">
                        <span class="hub-option-title">3 v 3</span>
                        <span class="hub-option-desc">Arena neon com obstáculos</span>
                    </button>
                </div>
            </div>
            <div class="hub-section">
                <h3>Jogadores</h3>
                <div class="hub-options" id="vs-options">
                    <button class="hub-option selected" data-vs="ai">
                        <span class="hub-option-title">VOCÊ vs IA</span>
                        <span class="hub-option-desc">Aliados e inimigos controlados pela IA</span>
                    </button>
                    <button class="hub-option" data-vs="pvp">
                        <span class="hub-option-title">P1 vs P2</span>
                        <span class="hub-option-desc">Dois jogadores (teclado ou controle)</span>
                    </button>
                </div>
            </div>
            <div class="hub-section">
                <h3>Arena</h3>
                <div class="hub-options hub-options-maps" id="map-options">
                    <button class="hub-option selected" data-map="random">
                        <span class="hub-option-title">🎲 Sorteio</span>
                        <span class="hub-option-desc">Uma arena diferente a cada luta</span>
                    </button>
                    <button class="hub-option" data-map="plaza">
                        <span class="hub-option-title">Praça Neon</span>
                        <span class="hub-option-desc">Árvores e caixas de papelão</span>
                    </button>
                    <button class="hub-option" data-map="rooftop">
                        <span class="hub-option-title">Telhado Neon</span>
                        <span class="hub-option-desc">Chuva, poças e letreiros em curto</span>
                    </button>
                    <button class="hub-option" data-map="lab">
                        <span class="hub-option-title">Laboratório</span>
                        <span class="hub-option-desc">Laser, fios soltos e tanques de vidro</span>
                    </button>
                    <button class="hub-option" data-map="garden">
                        <span class="hub-option-title">Jardim Suspenso</span>
                        <span class="hub-option-desc">Arbustos, plantas carnívoras e flores de cura</span>
                    </button>
                </div>
            </div>
            <div class="hub-section">
                <h3>Controles</h3>
                <div class="input-row" data-player="p1">
                    <span class="input-label">P1</span>
                    <button class="input-option selected" data-input="keyboard">⌨ Teclado</button>
                    <button class="input-option" data-input="gamepad">🎮 Controle</button>
                    <span class="gamepad-status"></span>
                </div>
                <div class="input-row hidden" data-player="p2">
                    <span class="input-label">P2</span>
                    <button class="input-option selected" data-input="keyboard">⌨ Teclado</button>
                    <button class="input-option" data-input="gamepad">🎮 Controle</button>
                    <span class="gamepad-status"></span>
                </div>
            </div>
            <button id="hub-start" class="hub-start">ESCOLHER LUTADORES ▶</button>
        </div>

        <div id="character-selection" class="overlay hidden">
            <button id="back-to-hub" class="back-button">◀ Menu</button>
            <h1>CYBERNETIC FURY</h1>
            <p id="selection-title" class="selection-title"></p>
            <div class="selection-grid">
                <div class="character-card" id="select-titan" data-lore="Titan foi um grande combatente da guerra que lutou bravamente pelo seu país e acabou perdendo muitos amigos. Sendo assim, acabou saindo, pois não estava mais gostando de ter tantas perdas. Hoje em dia, ele luta contra bandidos para proteger sua cidade.">
                    <h2>TITAN</h2>
                    <canvas id="titan-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-spark" data-lore="Spark é um robô que foi criado para garantir a segurança de um laboratório do governo. Porém, em um dia, uma grande explosão destruiu todos os outros robôs, fazendo com que apenas ele sobrasse e acabassem abandonando o projeto por falta de recursos. Depois de sair do laboratório, ele decidiu continuar a lutar, pois todo o seu corpo e essência eram feitos para isso.">
                    <h2>SPARK</h2>
                    <canvas id="spark-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-hades" data-lore="Um heroi de guerra que usava seus poderosos punhos de fogo para enfrentar o inimigo e levalos para conhecer as chamas eternas, quando foi destronado por seus aliados jurou lutar contra todos para voltar ao seu imperio.">
                    <h2>HADES</h2>
                    <canvas id="hades-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-jack" data-lore="Jack ja foi um homem, porem em uma noite de halloween ele acabou caindo em uma maldição que fez sua fantasia de terror ser eternamente grudada ao seu corpo e sendo obrigado a continuar o espirito de dia das bruxas para assustar todos que entrarem em seu caminho.">
                    <h2>JACK</h2>
                    <canvas id="jack-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-kaze" data-lore="Um lendário espadachim que viu o irmão ser morto. Desde então jurou caçar todos os envolvidos no ataque e está pronto para derramar o quanto de sangue for necessário. Dizem que, quando o vento muda de direção, Kaze já está atrás de você.">
                    <h2>KAZE</h2>
                    <canvas id="kaze-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-kenji" data-lore="não tem muita historia... ele apenas gosta de sair no soco">
                    <h2>KENJI</h2>
                    <canvas id="kenji-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-craque" data-lore="ele perdeu tudo em apostas e acabou tendo que morrar na rua, porém um dia o tecnico do maior time da espanha viu ele jogando com uma bola que encontrou na rua e percebeu potencial, depois de entrar para o time se tornou o melhor atacante em menos de 1 ano">
                    <h2>EL CRAQUE</h2>
                    <canvas id="craque-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-akane" data-lore="Akane, a Lâmina Carmesim, nunca conheceu a derrota. Cada corte que acerta devolve a ela um pouco de vida, e quando ela dança com a espada, sete golpes caem antes que o inimigo consiga reagir.">
                    <h2>AKANE</h2>
                    <canvas id="akane-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-fenris" data-lore="Fenris foi criado nos laboratórios de Neo-Cidade para caçar fugitivos nas sombras. Um dia se voltou contra os próprios criadores e hoje vaga pelos telhados como uma fera solta: quando ele salta, lâminas de sombra chovem do céu.">
                    <h2>FENRIS</h2>
                    <canvas id="fenris-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-zarek" data-lore="Um jovem assassino que encontrou uma foice viva que tenta dominar quem a empunha. A cada luta os dois disputam o controle: se Zarek estiver perdendo, a foice toma conta e ele vira Rubra, a fera vermelha; se estiver vencendo, ele domina a foice e vira Umbral, o assassino azul.">
                    <h2>ZAREK</h2>
                    <canvas id="zarek-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-celestia" data-lore="Uma guardiã que desceu das estrelas para proteger os que lutam ao seu lado. Por onde passa, flores de luz giram ao seu redor e fecham as feridas de seus aliados. Quando a batalha aperta, ela abre os braços e o círculo de cura se expande para abrigar o time inteiro.">
                    <h2>CELESTIA</h2>
                    <canvas id="celestia-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-flora" data-lore="Criada no coração de uma floresta que sobreviveu no meio da cidade de concreto, Flora aprendeu a falar com as plantas. Ela arremessa flores encantadas que voam sozinhas até o aliado mais próximo e desabrocham em cura.">
                    <h2>FLORA</h2>
                    <canvas id="flora-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-nyx" data-lore="Nyx foi cobaia de um experimento que tentava criar soldados que se regeneram. Deu errado: ela não consegue mais se curar sozinha, só roubando a vida dos outros. Hoje usa essa maldição a favor de quem luta ao seu lado, arrancando energia vital dos inimigos com as garras e mandando para os aliados.">
                    <h2>NYX</h2>
                    <canvas id="nyx-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-mamba" data-lore="Ex-atiradora de elite de uma corporação de armas químicas, Mamba fugiu levando o protótipo de um rifle que dispara toxinas. Escondida atrás da máscara de gás, ela espera pacientemente o momento certo: quando a linha vermelha aparece, o alvo já está condenado.">
                    <h2>MAMBA</h2>
                    <canvas id="mamba-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-gear" data-lore="Gear perdeu o braço num acidente na fábrica e construiu um mecânico com sucata. Desde então, nunca mais entrou numa briga sozinho: sempre leva uma torreta montada por ele mesmo, que atira em qualquer um que se aproxime.">
                    <h2>GEAR</h2>
                    <canvas id="gear-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-roxy" data-lore="A menor da gangue e a mais barulhenta. Roxy trocou os braços por implantes cibernéticos rosa para aguentar o coice das duas pistolas que nunca larga. Quando a adrenalina sobe, ela simplesmente não para de atirar — e cada pistola escolhe o seu alvo.">
                    <h2>ROXY</h2>
                    <canvas id="roxy-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-weaver" data-lore="Ninguém sabe quem está por trás da máscara. Weaver aparece pendurado entre os prédios neon, com lançadores de teia nos pulsos e um sexto sentido que avisa do perigo antes dele chegar. Atiradores escondidos lá atrás são o alvo favorito: uma teia, um puxão, e eles estão cara a cara com ele.">
                    <h2>WEAVER</h2>
                    <canvas id="weaver-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-aegis" data-lore="Aegis foi da tropa de choque da polícia de Neo-Cidade até o dia em que recebeu a ordem de atirar na multidão. Ele se recusou, levantou o escudo de energia na frente das pessoas e segurou a linha sozinho. Expulso da corporação, hoje ele luta para proteger quem está atrás dele: enquanto o escudo estiver de pé, ninguém passa.">
                    <h2>AEGIS</h2>
                    <canvas id="aegis-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-rhino" data-lore="Mercenário contratado para derrubar portas de bunkers, Rhino mandou soldar uma armadura de rinoceronte no próprio corpo para nunca mais ser parado por nada. Ele não desvia de obstáculos: atravessa. Caixas, torretas, paredes ou inimigos, tudo que estiver no caminho do estouro vai para o chão.">
                    <h2>RHINO</h2>
                    <canvas id="rhino-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-anchor" data-lore="Velho capitão de um cargueiro afundado numa tempestade de lixo tóxico, Anchor sobreviveu agarrado à âncora do navio e ganhou um corpo cibernético dos estaleiros do porto. Pesado como chumbo, nenhum empurrão tira ele do lugar. Quando joga a âncora, a corrente o arrasta até a presa, e ninguém escapa do porão.">
                    <h2>ANCHOR</h2>
                    <canvas id="anchor-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
            </div>
            <div id="lore-tooltip" class="hidden"></div>
        </div>

        <div id="loading-screen" class="overlay hidden">
            <div class="loading-controls">
                <h3>Controles</h3>
                <!-- Preenchido pelo jogo conforme o modo (1 jogador ou P1 vs P2) -->
                <div id="controls-content"></div>
            </div>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <span id="win-text"></span>
            <div id="match-stats"></div>
            <div class="game-over-buttons">
                <button id="rematch-button">Revanche</button>
                <button id="restart-button">Menu</button>
            </div>
        </div>

        <!-- Placar montado pelo jogo: uma coluna por time, um cartão por lutador -->
        <div id="hud"></div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Painel lateral com os controles (some em telas estreitas) -->
    <aside id="controls-panel">
        <h3>Controles</h3>
        <div id="controls-panel-content"></div>
    </aside>
    </div>

    <div id="volume-control">
        <button id="volume-icon" title="Silenciar / ativar som">🔊</button>
        <input type="range" id="volume-slider" min="0" max="100" value="70" aria-label="Volume">
        <span id="volume-value">70%</span>
    </div>

    <!-- A ordem importa: personagens e áudio primeiro, lógica do jogo por último -->
    <script src="characters.js"></script>
    <script src="audio.js"></script>
    <!-- Jogo dividido por assunto; todos compartilham as variáveis de config.js -->
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="maps.js"></script>
    <script src="effects.js"></script>
    <script src="fighter.js"></script>
    <script src="specials.js"></script>
    <script src="ai.js"></script>
    <script src="hud.js"></script>
    <script src="maps-draw.js"></script>
    <script src="input.js"></script>
    <script src="menu.js"></script>
    <script src="game.js"></script>
</body>
</html>
