<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybernetic Fury</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💢</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
</head>
<body>

    <div id="game-container">
        <div id="character-selection" class="overlay">
            <h1>CYBERNETIC FURY</h1>
            <div class="selection-grid">
                <div class="character-card" id="select-titan" data-lore="Titan foi um grande combatente da guerra que lutou bravamente pelo seu país e acabou perdendo muitos amigos. Sendo assim, acabou saindo, pois não estava mais gostando de ter tantas perdas. Hoje em dia, ele luta contra bandidos para proteger sua cidade.">
                    <h2>TITAN</h2>
                    <canvas id="titan-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-spark" data-lore="Spark é um robô que foi criado para garantir a segurança de um laboratório do governo. Porém, em um dia, uma grande explosão destruiu todos os outros robôs, fazendo com que apenas ele sobrasse e acabassem abandonando o projeto por falta de recursos. Depois de sair do laboratório, ele decidiu continuar a lutar, pois todo o seu corpo e essência eram feitos para isso.">
                    <h2>SPARK</h2>
                    <canvas id="spark-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-hades" data-lore="Um heroi de guerra que usava seus poderosos punhos de fogo para enfrentar o inimigo e levalos para conhecer as chamas eternas, quando foi destronado por seus aliados jurou lutar contra todos para voltar ao seu imperio.">
                    <h2>HADES</h2>
                    <canvas id="hades-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-jack" data-lore="Jack ja foi um homem, porem em uma noite de halloween ele acabou caindo em uma maldição que fez sua fantasia de terror ser eternamente grudada ao seu corpo e sendo obrigado a continuar o espirito de dia das bruxas para assustar todos que entrarem em seu caminho.">
                    <h2>JACK</h2>
                    <canvas id="jack-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-genji" data-lore="um lendario espadachin que teve que ver seu irmao ser morto, depois disso jurou matar todos aqueles que estiveram envolvidos no ataque e para isso esta preparado para derramar o quanto de sangue for necessário">
                    <h2>GENJI</h2>
                    <canvas id="genji-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-ryu" data-lore="não tem muita historia... ele apenas gosta de sair no soco">
                    <h2>RYU</h2>
                    <canvas id="ryu-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-lorenzo" data-lore="ele perdeu tudo em apostas e acabou tendo que morrar na rua, porém um dia o tecnico do maior time da espanha viu ele jogando com uma bola que encontrou na rua e percebeu potencial, depois de entrar para o time se tornou o melhor atacante em menos de 1 ano">
                    <h2>LORENZO</h2>
                    <canvas id="lorenzo-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-malenia" data-lore="A espada de miquela, ela nunca conheceu a derrota">
                    <h2>MALENIA</h2>
                    <canvas id="malenia-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
                <div class="character-card" id="select-maliketh" data-lore="Maliketh é a leal Besta Presa nas Sombras e meio-irmão da Rainha Marika, a Eterna, uma Empírea de ascendência Numen, que se tornaria o recipiente do Elden Ring">
                    <h2>MALIKETH</h2>
                    <canvas id="maliketh-thumbnail" class="thumbnail-canvas"></canvas>
                </div>
            </div>
            <div id="lore-tooltip" class="hidden"></div>
        </div>

        <div id="loading-screen" class="overlay hidden">
            <div class="loading-controls">
                <h3>Controles</h3>
                <div class="controls-grid">
                    <p><strong>Movimento:</strong> A, D</p>
                    <p><strong>Pulo:</strong> Espaço</p>
                    <p><strong>Defesa:</strong> Segurar S</p>
                    <p><strong>Soco Básico:</strong> Seta Esquerda</p>
                    <p><strong>Ataque Especial:</strong> Seta Direita</p>
                    <p><strong>Soco Forte:</strong> Frente, Frente + Seta Esq.</p>
                </div>
            </div>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <span id="win-text"></span>
            <button id="restart-button">Jogar Novamente</button>
        </div>

        <div id="hud">
            <div id="player1-hud" class="player-hud">
                <h3 id="p1-name">JOGADOR 1</h3>
                <div class="health-bar-outer">
                    <div id="p1-health" class="health-bar-inner"></div>
                    <span id="p1-health-text" class="bar-text"></span>
                </div>
                <div class="energy-bar-outer">
                    <div id="p1-energy" class="energy-bar-inner"></div>
                    <span id="p1-energy-text" class="bar-text"></span>
                </div>
                <div id="p1-status-effects" class="status-effects"></div>
            </div>
            <div id="player2-hud" class="player-hud">
                <h3 id="p2-name">COMPUTADOR</h3>
                <div class="health-bar-outer">
                    <div id="p2-health" class="health-bar-inner"></div>
                    <span id="p2-health-text" class="bar-text"></span>
                </div>
                <div class="energy-bar-outer">
                    <div id="p2-energy" class="energy-bar-inner"></div>
                    <span id="p2-energy-text" class="bar-text"></span>
                </div>
                <div id="p2-status-effects" class="status-effects"></div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- A ordem importa: personagens e áudio primeiro, lógica do jogo por último -->
    <script src="characters.js"></script>
    <script src="audio.js"></script>
    <script src="game.js"></script>
</body>
</html>
